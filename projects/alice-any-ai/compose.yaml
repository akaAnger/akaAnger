services:
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/.data
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - alice-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  alice-data:
