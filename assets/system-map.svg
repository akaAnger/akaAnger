<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">akaAnger system map</title>
  <desc id="desc">A dark terminal-inspired map connecting akaAnger to selected projects and build principles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#30363d" stroke-width="2"/>

  <g opacity=".13" stroke="#8b949e" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200"/>
    <path d="M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520"/>
  </g>

  <text x="48" y="54" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="16">SYSTEM MAP / PUBLIC INTERFACE</text>
  <text x="1150" y="54" text-anchor="end" fill="#7ee787" font-family="Consolas, Menlo, monospace" font-size="15">ONLINE</text>

  <path d="M600 184 L315 155 M600 184 L885 155 M600 184 L315 335 M600 184 L885 335" stroke="url(#beam)" stroke-width="3" fill="none"/>
  <circle cx="600" cy="184" r="8" fill="#7ee787" filter="url(#soft)"/>

  <rect x="470" y="118" width="260" height="132" rx="18" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" fill="#58a6ff" font-family="Consolas, Menlo, monospace" font-size="15">ROOT NODE</text>
  <text x="600" y="197" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, Menlo, monospace" font-size="31" font-weight="700">akaAnger</text>
  <text x="600" y="226" text-anchor="middle" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">programmer / builder</text>

  <g>
    <rect x="70" y="96" width="350" height="118" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="96" y="130" fill="#7ee787" font-family="Consolas, Menlo, monospace" font-size="15">01 / PEERCALL</text>
    <text x="96" y="161" fill="#f0f6fc" font-family="Consolas, Menlo, monospace" font-size="18">private browser audio</text>
    <text x="96" y="188" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">WebRTC · PWA · no account</text>
  </g>

  <g>
    <rect x="780" y="96" width="350" height="118" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="806" y="130" fill="#58a6ff" font-family="Consolas, Menlo, monospace" font-size="15">02 / LRC SYNC PLAYER</text>
    <text x="806" y="161" fill="#f0f6fc" font-family="Consolas, Menlo, monospace" font-size="18">lyrics locked to playback</text>
    <text x="806" y="188" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">Python · pygame · Rich · CLI</text>
  </g>

  <g>
    <rect x="70" y="276" width="350" height="118" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="96" y="310" fill="#d29922" font-family="Consolas, Menlo, monospace" font-size="15">03 / RETRO'98</text>
    <text x="96" y="341" fill="#f0f6fc" font-family="Consolas, Menlo, monospace" font-size="18">tiny games, old desktop energy</text>
    <text x="96" y="368" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">HTML · CSS · vanilla JavaScript</text>
  </g>

  <g>
    <rect x="780" y="276" width="350" height="118" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="806" y="310" fill="#f778ba" font-family="Consolas, Menlo, monospace" font-size="15">04 / STENA [PRIVATE]</text>
    <text x="806" y="341" fill="#f0f6fc" font-family="Consolas, Menlo, monospace" font-size="18">signal over feed noise</text>
    <text x="806" y="368" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">Telegram Mini App · product work</text>
  </g>

  <rect x="70" y="440" width="1060" height="46" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="469" text-anchor="middle" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="15">INPUT  →  REMOVE FRICTION  →  BUILD  →  TEST  →  SHIP  →  REPEAT</text>
</svg>